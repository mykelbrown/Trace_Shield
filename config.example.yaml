# Digital Footprint Intelligence (DFI) — investigation configuration
# Copy to config.yaml to override defaults. All keys are optional.

investigation:
  search_engines: true
  breach_checks: true
  social_search: true
  github_search: true
  document_search: true
  dns_search: true
  archive_search: true
  certificate_transparency: true

privacy:
  redact_sensitive_data: true
  store_raw_results: false
  local_only: true

risk:
  enabled: true
  weights:
    critical: 40
    high: 20
    medium: 8
    low: 2

rate_limit:
  requests_per_second: 2
  max_retries: 3
  backoff_base_ms: 500
  request_timeout_ms: 10000
  cache_ttl_seconds: 3600

retention:
  research_log_days: 90

platforms:
  username_enumeration:
    - github
    - gitlab
    - reddit
    - x
    - instagram
    - tiktok
    - youtube
    - stackoverflow
    - medium
    - devto
    - hackernews
    - keybase
